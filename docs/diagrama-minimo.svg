<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Hiraishin-Z80 — diagrama do mínimo obrigatório</title>
<desc id="descricao">Reset e clock ligados à CPU Z80. CPU, EEPROM AT28C256, SRAM KM62256DLP-7, decodificação 74HCT138 com lógica HCT e UART PC16550D conectados por barramentos. A UART comunica com um terminal Linux através de adaptador USB–serial TTL. Sem vídeo dedicado, som ou GPIO.</desc>
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#345773"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#17344c}.titulo{font-size:32px;font-weight:bold}.nome{font-size:24px;font-weight:bold}.codigo{font-size:22px}.nota{font-size:18px}.caixa{stroke:#42637d;stroke-width:2;rx:12}.ligacao{stroke:#345773;stroke-width:3;fill:none}</style>
<rect width="1400" height="800" fill="white"/>
<text x="700" y="55" text-anchor="middle" class="titulo">Hiraishin-Z80 — Mínimo obrigatório</text>
<rect x="70" y="110" width="260" height="100" fill="#eee7fa" class="caixa"/>
<text x="200" y="169" text-anchor="middle" class="nome">RESET</text>
<rect x="470" y="95" width="460" height="130" fill="#dceefd" class="caixa"/>
<text x="700" y="145" text-anchor="middle" class="nome">CPU Z80</text><text x="700" y="185" text-anchor="middle" class="codigo">Z0840006PSC</text>
<rect x="1070" y="110" width="260" height="100" fill="#eee7fa" class="caixa"/>
<text x="1200" y="151" text-anchor="middle" class="nome">CLOCK</text><text x="1200" y="185" text-anchor="middle" class="codigo">1 MHz</text>
<path d="M330 160H470" class="ligacao" marker-end="url(#seta)"/><path d="M1070 160H930" class="ligacao" marker-end="url(#seta)"/>
<path d="M700 225V285" class="ligacao"/>
<rect x="50" y="285" width="1300" height="85" fill="#f0f4f8" class="caixa"/>
<text x="700" y="336" text-anchor="middle" class="nome">BARRAMENTOS: ENDEREÇOS · DADOS · CONTROLE</text>
<path d="M190 370V435 M530 370V435 M870 370V435 M1210 370V435" class="ligacao"/>
<rect x="50" y="435" width="280" height="115" fill="#fff1d4" class="caixa"/>
<text x="190" y="479" text-anchor="middle" class="nome">EEPROM</text><text x="190" y="518" text-anchor="middle" class="codigo">AT28C256</text>
<rect x="390" y="435" width="280" height="115" fill="#e0f3e6" class="caixa"/>
<text x="530" y="479" text-anchor="middle" class="nome">RAM</text><text x="530" y="518" text-anchor="middle" class="codigo">KM62256DLP-7</text>
<rect x="730" y="435" width="280" height="115" fill="#f5e5d9" class="caixa"/>
<text x="870" y="479" text-anchor="middle" class="nome">DECODIFICAÇÃO</text><text x="870" y="518" text-anchor="middle" class="codigo">74HCT138 + lógica HCT</text>
<rect x="1070" y="435" width="280" height="115" fill="#dceefd" class="caixa"/>
<text x="1210" y="479" text-anchor="middle" class="nome">E/S — SERIAL</text><text x="1210" y="518" text-anchor="middle" class="codigo">PC16550D</text>
<path d="M1210 550V630" class="ligacao" marker-start="url(#seta)" marker-end="url(#seta)"/>
<rect x="930" y="630" width="420" height="100" fill="#f4f7fa" class="caixa"/>
<text x="1140" y="671" text-anchor="middle" class="codigo">USB–serial TTL ↔ PC Linux</text><text x="1140" y="706" text-anchor="middle" class="nota">Terminal: teclado, tela e envio de binários</text>
<text x="50" y="623" class="nota">As ligações representam conjuntos de sinais, não um único fio.</text>
<text x="50" y="658" class="nota">A decodificação gera as seleções de memória e E/S.</text>
<text x="50" y="693" class="nota">Alimentação, desacoplamento e pinagem serão detalhados no esquemático.</text>
<text x="700" y="775" text-anchor="middle" class="nota">O Z80 executa bootloader, SO e aplicação. O PC Linux é apenas apoio e terminal.</text>
</svg>
